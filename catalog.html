<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Coffee House — Menu</title>
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="/" class="logo">Resource</a>
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="index.html#favorites" class="nav__link">Favorite coffee</a>
            </li>
            <li class="nav__item">
              <a href="index.html#about" class="nav__link">About</a>
            </li>
            <li class="nav__item">
              <a href="index.html#app" class="nav__link">Mobile app</a>
            </li>
            <li class="nav__item">
              <a href="index.html#footer" class="nav__link">Contact us</a>
            </li>
          </ul>
        </nav>

        <div class="header__actions">
          <a href="catalog.html" class="menu-link">Menu</a>
          <button type="button" class="theme-toggle" aria-label="Switch theme">
            <span class="theme-toggle__icon theme-toggle__icon--light">☀</span>
            <span class="theme-toggle__icon theme-toggle__icon--dark">☾</span>
          </button>

          <button type="button" class="burger" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main></main>

    <footer class="footer">
    <div class="footer__inner">
      <div class="footer__offer">
        <p class="footer__slogan">
          Sip, Savor, Smile.<br />
          <em>It's coffee time!</em>
        </p>

        <ul class="socials">
          <li>
            <a href="https://twitter.com" class="socials__link" aria-label="Twitter" target="_blank" rel="noopener noreferrer">
              <!-- иконка -->
            </a>
          </li>
          <li>
            <a href="https://instagram.com" class="socials__link" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
              <!-- иконка -->
            </a>
          </li>
          <li>
            <a href="https://facebook.com" class="socials__link" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
              <!-- иконка -->
            </a>
          </li>
        </ul>
      </div>

      <div class="footer__contacts">
        <h2 class="footer__title">Contact us</h2>

        <ul class="contacts-list">
          <li>
            <a href="https://maps.google.com/?q=8558+Green+Rd" class="contacts-list__link" target="_blank" rel="noopener noreferrer">
              8558 Green Rd., LA
            </a>
          </li>
          <li>
            <a href="tel:+16035550123" class="contacts-list__link">+1 (603) 555-0123</a>
          </li>
          <li class="contacts-list__item">Mon–Sat: 9:00–23:00</li>
        </ul>
      </div>
    </div>
  </footer>

    <script type="module" src="/src/catalog.js"></script>
  </body>
</html>
